<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1117">
  <title>GameVault</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="sticky-top">
    <div class="topbar">
      <h1>GameVault</h1>
      <div class="topbar-actions">
        <select id="sort" aria-label="Sort games">
          <option value="recent">Recently added</option>
          <option value="name">Name</option>
          <option value="mostPlayed">Most played</option>
          <option value="lastPlayed">Last played</option>
        </select>
        <button type="button" class="icon-btn" id="view-toggle" aria-label="Toggle view">⌘ List</button>
        <button type="button" class="icon-btn" id="add-btn" aria-label="Add games">+</button>
      </div>
    </div>
    <div class="search-row">
      <input type="search" id="search" placeholder="Search games" aria-label="Search games">
    </div>
  </header>

  <main>
    <section class="stats" id="stats">
      <div class="stat">
        <span class="stat-value" id="stat-total">0</span>
        <span class="stat-label">Total games</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="stat-plays">0</span>
        <span class="stat-label">Total plays</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="stat-most-played">–</span>
        <span class="stat-label">Most played</span>
      </div>
    </section>

    <section id="home">
      <div class="view-header">
        <h2>Library</h2>
      </div>
      <ul class="list game-grid" id="game-grid"></ul>
      <ul class="list game-list" id="game-list" hidden></ul>
      <p class="empty" id="empty"></p>
    </section>

    <section id="add-games" hidden>
      <div class="view-header">
        <h2>Add games</h2>
        <div class="add-actions">
          <span class="selected-count" id="selected-count">0</span> selected
        </div>
      </div>
      <ul class="list" id="installed-list"></ul>
      <div class="add-footer">
        <button type="button" class="btn ghost" id="cancel-add">Cancel</button>
        <button type="button" class="btn primary" id="done-add">Add selected</button>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
