name: Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from Gradle
        id: version
        run: |
          VERSION=$(grep -oP "versionName ['\"]\K[^'\"]+" app/build.gradle | head -1)
          if [ -z "$VERSION" ]; then
            echo "Could not read versionName from app/build.gradle"
            exit 1
          fi
          APK="artifacts/gamevault-${VERSION}-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "No APK committed at $APK"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "Releasing $APK" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: GameVault ${{ steps.version.outputs.version }}
          files: ${{ steps.version.outputs.apk }}
          fail_on_unmatched_files: true
          generate_release_notes: false
          body: |
            Offline-first Android gaming library.

            **Install:** download the APK below and open it on your phone (allow installs from this source if prompted).

            This build is debug-signed, so it can be sideloaded but not published to Google Play. All data stays on the device: no account, no cloud sync.
